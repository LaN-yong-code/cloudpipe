<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="纯前端（原生 JavaScript + SVG）程序化积雨云天空盒生成器，支持实时调参、拖拽全景与透明 PNG 导出。">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%81%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <title>程序化积雨云 - 终极天空盒</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.95);
      --text-color: #f8fafc;
      --accent: #60a5fa;
      --border: rgba(255, 255, 255, 0.1);
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      user-select: none;
    }
    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background: linear-gradient(to bottom, #1E3A8A 0%, #FDFBF7 100%);
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    #canvas-container:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    svg {
      width: 100%;
      height: 100%;
      pointer-events: none; 
    }
    #controls {
      width: 340px;
      background: var(--panel-bg);
      backdrop-filter: blur(15px);
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      z-index: 10;
      overflow-y: auto;
    }
    
    details {
      border-bottom: 1px solid var(--border);
      padding: 0;
    }
    details[open] {
      padding-bottom: 16px;
    }
    summary {
      padding: 16px;
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    summary:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    summary::-webkit-details-marker {
      display: none;
    }
    summary::after {
      content: '+';
      font-size: 18px;
      color: #94a3b8;
      transition: transform 0.3s;
    }
    details[open] summary::after {
      content: '−';
      transform: rotate(180deg);
    }
    .panel-content {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .control-header span {
      color: var(--accent);
      font-family: monospace;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    input[type="range"]::-moz-range-track {
      height: 4px;
      background: #334155;
      border-radius: 2px;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    input[type="range"]:focus-visible,
    button:focus-visible {
      outline: 2px solid #93c5fd;
      outline-offset: 2px;
    }
    
    .btn-group {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border: none;
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background: var(--accent);
      color: #0f172a;
    }
    .btn-primary:hover {
      background: #93c5fd;
    }
    .btn-secondary {
      background: transparent;
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      color: #64748b;
      pointer-events: none;
      z-index: 20;
    }

    @media (max-width: 820px) {
      #app {
        flex-direction: column;
      }
      #canvas-container {
        flex: 1 1 auto;
        min-height: 50vh;
      }
      #controls {
        width: 100%;
        max-height: 45vh;
        border-left: none;
        border-top: 1px solid var(--border);
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
      }
      .btn-group {
        flex-direction: row;
      }
      .btn-group button {
        flex: 1;
      }
    }
  </style>
</head>
<body>

<div id="app">
  <div id="canvas-container" tabindex="0" aria-label="云层预览，可拖拽或使用左右方向键平移">
    <div class="loading" id="loading" role="status" aria-live="polite">☁️ 正在生成天空盒...</div>
    
    <svg id="skybox" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="程序化生成的积雨云天空" style="opacity: 0; transition: opacity 0.5s;">
      <defs>
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1E3A8A" /> 
          <stop offset="45%" stop-color="#4A72A6" /> 
          <stop offset="100%" stop-color="#FDFBF7" /> 
        </linearGradient>

        <radialGradient id="grad-highlight-edge" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
          <stop offset="35%" stop-color="#ffffff" stop-opacity="0.98" />
          <stop offset="70%" stop-color="#fffdf5" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#fffef0" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="grad-hi" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
          <stop offset="20%" stop-color="#ffffff" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="grad-mid-hi" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.95" />
          <stop offset="25%" stop-color="#cbd5e1" stop-opacity="0.6" />
          <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="grad-mid" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.9" />
          <stop offset="30%" stop-color="#64748b" stop-opacity="0.5" />
          <stop offset="100%" stop-color="#64748b" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="grad-mid-low" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#475569" stop-opacity="0.95" />
          <stop offset="30%" stop-color="#334155" stop-opacity="0.6" />
          <stop offset="100%" stop-color="#334155" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="grad-low" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#1e293b" stop-opacity="1" />
          <stop offset="20%" stop-color="#0f172a" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
        </radialGradient>
      </defs>
      
      <g id="panGroup">
        <g id="scaleGroup">
          <!-- 背景层：导出时会被剔除 -->
          <rect id="sky-bg-rect" x="-1000" y="-1000" width="5000" height="3000" fill="url(#skyGrad)"/>
          <g id="cloudScene"></g>
        </g>
      </g>
    </svg>
  </div>

  <div id="controls">
    <details open>
      <summary>🌍 天空盒与环境</summary>
      <div class="panel-content">
        <div class="control-group">
          <div class="control-header">整体缩放 <span id="val-overallScale">1.0</span></div>
          <input type="range" id="param-overallScale" aria-label="整体缩放" min="0.1" max="2.5" step="0.05" value="1.0">
        </div>
        <div class="control-group">
          <div class="control-header">云团数量 (组) <span id="val-cloudCount">10</span></div>
          <input type="range" id="param-cloudCount" aria-label="云团数量" min="1" max="20" step="1" value="10">
        </div>
        <div class="control-group">
          <div class="control-header">全局底到顶高度 <span id="val-height">0.7</span></div>
          <input type="range" id="param-height" aria-label="全局底到顶高度" min="0.3" max="2.0" step="0.05" value="0.7">
        </div>
      </div>
    </details>

    <details open>
      <summary>📐 云团形态</summary>
      <div class="panel-content">
        <div class="control-group">
          <div class="control-header">底部宽度 <span id="val-baseW">1.0</span></div>
          <input type="range" id="param-baseW" aria-label="底部宽度" min="0.5" max="1.5" step="0.05" value="1.0">
        </div>
        <div class="control-group">
          <div class="control-header">腰部收束 <span id="val-waist">1.0</span></div>
          <input type="range" id="param-waist" aria-label="腰部收束" min="0.5" max="1.5" step="0.05" value="1.0">
        </div>
        <div class="control-group">
          <div class="control-header">顶部蓬松度 <span id="val-topSpread">1.0</span></div>
          <input type="range" id="param-topSpread" aria-label="顶部蓬松度" min="0.5" max="1.5" step="0.05" value="1.0">
        </div>
        <div class="control-group">
          <div class="control-header">边缘扰动 (离散度) <span id="val-noise">1.0</span></div>
          <input type="range" id="param-noise" aria-label="边缘扰动" min="0" max="2.0" step="0.1" value="1.0">
        </div>
      </div>
    </details>

    <details open>
      <summary>🎨 光影与材质</summary>
      <div class="panel-content">
        <div class="control-group">
          <div class="control-header">圆点大小 <span id="val-dotSize">1.0</span></div>
          <input type="range" id="param-dotSize" aria-label="圆点大小" min="0.3" max="2.0" step="0.05" value="1.0">
        </div>
        <div class="control-group">
          <div class="control-header">大小离散度 <span id="val-sizeDispersion">1.0</span></div>
          <input type="range" id="param-sizeDispersion" aria-label="大小离散度" min="0" max="2.5" step="0.1" value="1.0">
        </div>
        <div class="control-group">
          <div class="control-header">渐变强度 (边缘虚化) <span id="val-gradIntensity">1.0</span></div>
          <input type="range" id="param-gradIntensity" aria-label="渐变强度" min="0.3" max="2.0" step="0.1" value="1.0">
        </div>
        <div class="control-group">
          <div class="control-header">高光层亮度 <span id="val-highlightBright">1.0</span></div>
          <input type="range" id="param-highlightBright" aria-label="高光层亮度" min="0.2" max="1.5" step="0.1" value="1.0">
        </div>
      </div>
    </details>

    <details>
      <summary>⚙️ 高级与性能</summary>
      <div class="panel-content">
        <div class="control-group">
          <div class="control-header">全局密度 (性能) <span id="val-density">1.0</span></div>
          <input type="range" id="param-density" aria-label="全局密度" min="0.3" max="1.5" step="0.1" value="1.0">
        </div>
        <div class="control-group">
          <div class="control-header">形态随机度 <span id="val-seed">0</span></div>
          <input type="range" id="param-seed" aria-label="形态随机种子" min="0" max="9999" step="1" value="0">
        </div>
      </div>
    </details>

    <!-- 按钮组 -->
    <div class="btn-group">
      <button id="btn-randomize" class="btn-primary">🎲 重新生成天空</button>
      <button id="btn-export" class="btn-secondary">📥 导出透明云 (PNG)</button>
    </div>
  </div>
</div>

<script>
// In memory of Bob Ross. Happy little clouds. We don't make mistakes, just happy little accidents.
(function() {
  var svgNS = "http://www.w3.org/2000/svg";
  var scene = document.getElementById("cloudScene");
  var svgEl = document.getElementById("skybox");
  var loadingText = document.getElementById("loading");
  var container = document.getElementById("canvas-container");
  var panGroup = document.getElementById("panGroup");
  var scaleGroup = document.getElementById("scaleGroup");

  var state = {
    overallScale: 1.0,
    cloudCount: 10,
    height: 0.7,
    
    baseW: 1.0,
    waist: 1.0,
    topSpread: 1.0,
    noise: 1.0,
    
    dotSize: 1.0,
    sizeDispersion: 1.0,
    gradIntensity: 1.0,
    highlightBright: 1.0,
    
    density: 1.0,
    seed: 0
  };

  function rand(n) {
    var x = Math.imul(n | 0, 374761393) + Math.imul(state.seed | 0, 668265263);
    x = Math.imul(x ^ (x >>> 13), 1274126177);
    x = x ^ (x >>> 16);
    return (x >>> 0) / 4294967296;
  }

  var baseClusters = [
    { cx: 380, cy: 160, rx: 70, ry: 65, type: 'top', p: 20 },
    { cx: 450, cy: 180, rx: 75, ry: 70, type: 'top', p: 20 },
    { cx: 320, cy: 200, rx: 75, ry: 70, type: 'top', p: 20 },
    { cx: 510, cy: 220, rx: 70, ry: 65, type: 'top', p: 20 },
    { cx: 280, cy: 250, rx: 65, ry: 60, type: 'top', p: 20 },
    { cx: 400, cy: 280, rx: 100, ry: 85, type: 'mid', p: 25 },
    { cx: 300, cy: 330, rx: 110, ry: 90, type: 'mid', p: 25 },
    { cx: 500, cy: 320, rx: 115, ry: 95, type: 'mid', p: 25 },
    { cx: 400, cy: 390, rx: 130, ry: 100, type: 'mid', p: 30 },
    { cx: 400, cy: 520, rx: 230, ry: 140, type: 'base', p: 45 },
    { cx: 280, cy: 500, rx: 150, ry: 110, type: 'base', p: 30 },
    { cx: 520, cy: 500, rx: 150, ry: 110, type: 'base', p: 30 }
  ];

  function renderSingleCloud(group, cloudSeedOffset, heightScale) {
    var pivotY = 520; 

    var clusters = baseClusters.map(function(base, idx) {
      var seedVal = idx + cloudSeedOffset;
      
      var scaledCy = pivotY - (pivotY - base.cy) * state.height * heightScale;
      var scaledRy = base.ry * state.height * heightScale;
      
      var rxMultiplier = 1.0;
      if (base.type === 'base') rxMultiplier = state.baseW;
      else if (base.type === 'mid') rxMultiplier = state.waist;
      else if (base.type === 'top') rxMultiplier = state.topSpread;

      return {
        cx: base.cx + (rand(seedVal) - 0.5) * 40 * state.noise, 
        cy: scaledCy + (rand(seedVal + 100) - 0.5) * 40 * state.noise,
        rx: base.rx * rxMultiplier * (0.8 + rand(seedVal + 200) * 0.4),
        ry: scaledRy * (0.8 + rand(seedVal + 300) * 0.4),
        type: base.type,
        p: Math.floor(base.p * state.density)
      };
    });

    clusters.sort(function(a, b) { return a.cy - b.cy; });

    clusters.forEach(function(cluster, cIdx) {
      var clusterGlobalLight = ((400 - cluster.cx) / 400) * 0.3 + ((400 - cluster.cy) / 400) * 0.6;

      for (var i = 0; i < cluster.p; i++) {
        var seedBase = cloudSeedOffset + cIdx * 100 + i;
        
        var angle = rand(seedBase) * Math.PI * 2;
        var dist = Math.pow(rand(seedBase + 50), 0.6); 
        
        var nx = Math.cos(angle) * dist;
        var ny = Math.sin(angle) * dist;
        
        var finalNx = nx;
        if (cluster.type === 'top') {
          if (ny > 0) finalNx = nx * (1 - 0.6 * ny); 
          else finalNx = nx * (1 - 0.1 * ny); 
        } else if (cluster.type === 'base') {
          if (ny > 0) finalNx = nx * (1 + 0.8 * ny); 
          else finalNx = nx * (1 + 0.4 * ny); 
        } else {
          finalNx = nx * (1 + 0.15 * Math.sin(ny * Math.PI));
        }
        
        var x = cluster.cx + finalNx * cluster.rx;
        var y = cluster.cy + ny * cluster.ry;
        
        x += (rand(seedBase + 150) - 0.5) * 40 * state.noise;
        y += (rand(seedBase + 200) - 0.5) * 25 * state.height * heightScale;
        
        var rBase = cluster.rx * 0.15 + 20;
        var rRand = rand(seedBase + 250) * 70 * state.sizeDispersion;
        var r = (rBase + rRand) * state.dotSize;
        
        var localLight = (-nx * 0.4 - ny * 0.6) + (dist * 0.3);
        var light = clusterGlobalLight + localLight + (rand(seedBase + 300) - 0.5) * 0.15;
        
        var fillId;
        if (light > 0.6) {
          fillId = "url(#grad-highlight-edge)";
          r *= 0.65; 
        } else if (light > 0.3) {
          fillId = "url(#grad-hi)";
        } else if (light > 0.0) {
          fillId = "url(#grad-mid-hi)";
        } else if (light > -0.3) {
          fillId = "url(#grad-mid)";
        } else if (light > -0.6) {
          fillId = "url(#grad-mid-low)";
        } else {
          fillId = "url(#grad-low)";
        }
        
        var c = document.createElementNS(svgNS, "circle");
        c.setAttribute("cx", x.toFixed(1));
        c.setAttribute("cy", y.toFixed(1));
        c.setAttribute("r", r.toFixed(1));
        c.setAttribute("fill", fillId);
        group.appendChild(c);
      }
    });
  }

  function updateVisuals() {
    var scaleT = `translate(${1500 - 1500 * state.overallScale}, ${500 - 500 * state.overallScale}) scale(${state.overallScale})`;
    scaleGroup.setAttribute("transform", scaleT);
    
    var gradHi = document.getElementById("grad-hi").children;
    gradHi[1].setAttribute("stop-opacity", (0.8 * state.gradIntensity).toFixed(2));
    
    var gradMidHi = document.getElementById("grad-mid-hi").children;
    gradMidHi[1].setAttribute("stop-opacity", (0.6 * state.gradIntensity).toFixed(2));
    
    var gradMid = document.getElementById("grad-mid").children;
    gradMid[1].setAttribute("stop-opacity", (0.5 * state.gradIntensity).toFixed(2));

    var gradHighlight = document.getElementById("grad-highlight-edge").children;
    gradHighlight[0].setAttribute("stop-opacity", (1.0 * state.highlightBright).toFixed(2));
    gradHighlight[1].setAttribute("stop-opacity", (0.98 * state.highlightBright).toFixed(2));
    gradHighlight[2].setAttribute("stop-opacity", (0.4 * state.highlightBright).toFixed(2));

    updatePanLimit();
    applyPan();
  }

  var isFirstRender = true;
  var renderTimer = null;

  function render() {
    loadingText.style.display = "block";
    if (isFirstRender) {
      svgEl.style.opacity = "0";
    }

    clearTimeout(renderTimer);
    renderTimer = setTimeout(function() {
      while (scene.firstChild) {
        scene.removeChild(scene.firstChild);
      }

      var cloudParams = [];
      var numGroups = state.cloudCount;
      var cloudsPerGroup = 5;
      
      var weights = [];
      var totalWeight = 0;
      for (var w = 0; w < numGroups; w++) {
        var val = 0.3 + rand(w + 40000) * 1.4; 
        weights.push(val);
        totalWeight += val;
      }

      var currentX = -200; 
      var totalWidth = 3400; 

      for (var g = 0; g < numGroups; g++) {
        var groupWidth = (weights[g] / totalWeight) * totalWidth;
        var groupCenterX = currentX + groupWidth / 2;
        currentX += groupWidth;

        groupCenterX += (rand(g + 50000) - 0.5) * 100;

        for (var c = 0; c < cloudsPerGroup; c++) {
          var seedBase = g * 1000 + c * 77 + 100;
          
          var offsetX = (rand(seedBase) - 0.5) * 350;
          var offsetY = (rand(seedBase + 1) - 0.5) * 30; 
          
          var cloudScale = 0.2 + rand(seedBase + 2) * 0.7;
          var cloudHeightScale = 0.3 + rand(seedBase + 4) * 2.0; 
          
          var opacity = 0.4 + cloudScale * 0.6;
          var baseY = 550 + (1 - cloudScale) * 120 + offsetY;
          
          cloudParams.push({
            x: groupCenterX + offsetX,
            y: baseY,
            scale: cloudScale,
            heightScale: cloudHeightScale, 
            opacity: opacity,
            seedOffset: seedBase + 7777
          });
        }
      }

      cloudParams.sort(function(a, b) {
        var sortA = a.scale + (rand(a.seedOffset + 888) - 0.5) * 0.8;
        var sortB = b.scale + (rand(b.seedOffset + 888) - 0.5) * 0.8;
        return sortA - sortB;
      });

      cloudParams.forEach(function(p) {
        var g = document.createElementNS(svgNS, "g");
        var tx = p.x - 400 * p.scale;
        var ty = p.y - 520 * p.scale;
        
        g.setAttribute("transform", `translate(${tx}, ${ty}) scale(${p.scale})`);
        g.setAttribute("opacity", p.opacity.toFixed(2));
        
        renderSingleCloud(g, p.seedOffset, p.heightScale);
        scene.appendChild(g);
      });

      loadingText.style.display = "none";
      svgEl.style.opacity = "1";
      isFirstRender = false;
      
      updateVisuals();
      applyPan();
      
    }, isFirstRender ? 50 : 16);
  }

  let renderTimeout;
  function debouncedRender() {
    clearTimeout(renderTimeout);
    renderTimeout = setTimeout(render, 150);
  }

  var isDragging = false;
  var pointerId = null;
  var startMouseX = 0;
  var currentPanX = 0;
  var panLimit = 1000;

  function updatePanLimit() {
    panLimit = 1000 * state.overallScale;
  }

  function applyPan() {
    if (currentPanX > panLimit) currentPanX = panLimit;
    if (currentPanX < -panLimit) currentPanX = -panLimit;
    panGroup.setAttribute("transform", `translate(${currentPanX.toFixed(1)}, 0)`);
  }

  function panBy(dx) {
    var scaleFactor = 3000 / Math.max(container.clientWidth, 100);
    currentPanX += dx * scaleFactor;
    applyPan();
  }

  container.addEventListener('pointerdown', function(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    isDragging = true;
    startMouseX = e.clientX;
    pointerId = e.pointerId;
    if (container.setPointerCapture) {
      try {
        container.setPointerCapture(pointerId);
      } catch (err) {}
    }
  });

  container.addEventListener('pointermove', function(e) {
    if (!isDragging) return;
    var dx = e.clientX - startMouseX;
    startMouseX = e.clientX;
    panBy(dx);
  });

  function endDrag() {
    if (!isDragging) return;
    isDragging = false;
    if (pointerId !== null && container.releasePointerCapture) {
      try {
        container.releasePointerCapture(pointerId);
      } catch (err) {}
    }
    pointerId = null;
  }

  container.addEventListener('pointerup', endDrag);
  container.addEventListener('pointercancel', endDrag);
  container.addEventListener('lostpointercapture', endDrag);

  container.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') {
      panBy(-40);
      e.preventDefault();
    } else if (e.key === 'ArrowRight') {
      panBy(40);
      e.preventDefault();
    }
  });

  function bindUI() {
    var inputs = [
      { id: 'overallScale', isVisual: true },
      { id: 'cloudCount', isVisual: false },
      { id: 'height', isVisual: false },
      { id: 'baseW', isVisual: false },
      { id: 'waist', isVisual: false },
      { id: 'topSpread', isVisual: false },
      { id: 'noise', isVisual: false },
      { id: 'dotSize', isVisual: false },
      { id: 'sizeDispersion', isVisual: false },
      { id: 'gradIntensity', isVisual: true },
      { id: 'highlightBright', isVisual: true },
      { id: 'density', isVisual: false },
      { id: 'seed', isVisual: false }
    ];

    inputs.forEach(function(item) {
      var el = document.getElementById('param-' + item.id);
      var display = document.getElementById('val-' + item.id);
      
      el.addEventListener('input', function(e) {
        var val = parseFloat(e.target.value);
        state[item.id] = val;
        display.textContent = (val % 1 === 0) ? val : val.toFixed(2);
        
        if (item.isVisual) {
          updateVisuals();
        } else {
          debouncedRender();
        }
      });
    });

    document.getElementById('btn-randomize').addEventListener('click', function() {
      var seed = Math.floor(Math.random() * 10000);
      state.seed = seed;
      document.getElementById('param-seed').value = seed;
      document.getElementById('val-seed').textContent = seed;
      render();
    });
  }

  // ================= 导出透明云 PNG =================
  document.getElementById('btn-export').addEventListener('click', function() {
    var btn = this;
    var originalBtnText = btn.innerHTML;

    function restoreButton() {
      btn.innerHTML = originalBtnText;
      btn.disabled = false;
    }

    btn.innerHTML = "⏳ 正在渲染 PNG...";
    btn.disabled = true;

    setTimeout(function() {
      try {
        var clone = svgEl.cloneNode(true);
        clone.removeAttribute('style');

        var bgRect = clone.querySelector('#sky-bg-rect');
        if (bgRect && bgRect.parentNode) {
          bgRect.parentNode.removeChild(bgRect);
        }

        var rect = container.getBoundingClientRect();
        var viewWidth = Math.max(rect.width, 1);
        var viewHeight = Math.max(rect.height, 1);
        var viewScale = Math.max(viewWidth / 3000, viewHeight / 1000);
        var cropWidth = Math.min(3000, viewWidth / viewScale);
        var cropHeight = Math.min(1000, viewHeight / viewScale);
        var cropX = 1500 - cropWidth / 2;
        var cropY = 500 - cropHeight / 2;

        var longestSide = 3200;
        var exportWidth, exportHeight;
        if (cropWidth >= cropHeight) {
          exportWidth = longestSide;
          exportHeight = Math.round(longestSide * cropHeight / cropWidth);
        } else {
          exportHeight = longestSide;
          exportWidth = Math.round(longestSide * cropWidth / cropHeight);
        }

        clone.setAttribute('viewBox', cropX + ' ' + cropY + ' ' + cropWidth + ' ' + cropHeight);
        clone.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        clone.setAttribute('width', exportWidth);
        clone.setAttribute('height', exportHeight);

        var serializer = new XMLSerializer();
        var svgString = serializer.serializeToString(clone);

        if (!svgString.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
          svgString = svgString.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
        }
        if (!svgString.match(/^<svg[^>]+xmlns:xlink="http\:\/\/www\.w3\.org\/1999\/xlink"/)) {
          svgString = svgString.replace(/^<svg/, '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
        }

        var svgData = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
        var img = new Image();

        img.onload = function() {
          var canvas = document.createElement('canvas');
          canvas.width = exportWidth;
          canvas.height = exportHeight;
          var ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, exportWidth, exportHeight);
          ctx.drawImage(img, 0, 0, exportWidth, exportHeight);

          canvas.toBlob(function(blob) {
            if (!blob) {
              alert("导出失败：浏览器无法生成 PNG。");
              restoreButton();
              return;
            }
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'happy_little_clouds_' + state.seed + '_' + exportWidth + 'x' + exportHeight + '.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
            restoreButton();
          }, 'image/png');
        };

        img.onerror = function(err) {
          console.error("SVG 转 Image 失败", err);
          alert("导出失败，可能是由于某些浏览器限制。请尝试更换浏览器。");
          restoreButton();
        };

        img.src = svgData;
      } catch (err) {
        console.error("导出错误:", err);
        alert("导出过程发生错误");
        restoreButton();
      }
    }, 100);
  });
  // =================================================

  bindUI();
  render();
})();
</script>
</body>
</html>
